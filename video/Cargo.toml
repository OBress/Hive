[package]
name = "hive-demo-video"
version = "0.1.0"
edition = "2024"
publish = false

# Same release on every machine. Windows links a prebuilt FFmpeg 9 shared build (FFMPEG_DIR),
# macOS/Linux download a static FFmpeg with the H.264 encoder.
[dependencies]
fframes = { version = "=1.2.1-rc.15", features = ["compile-time-svgtree", "cli"] }
fframes_native_player = { version = "=1.2.1-rc.15", default-features = false, features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
fframes_skia_renderer = { version = "=1.2.1-rc.15", features = ["metal", "cli"] }
fframes_native_player = { version = "=1.2.1-rc.15", default-features = false, features = ["metal", "audio"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
fframes_skia_renderer = { version = "=1.2.1-rc.15", features = ["vulkan", "cli"] }
fframes_native_player = { version = "=1.2.1-rc.15", default-features = false, features = ["vulkan", "audio"] }

[target.'cfg(not(windows))'.dependencies]
fframes = { version = "=1.2.1-rc.15", features = ["compile-time-svgtree", "cli", "h264", "libav-agree-gpl"] }

[lib]
name = "hive_demo_video"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "hive-demo-video"
path = "src/main.rs"

[workspace]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
